stages:
  - test
  - build
  - deploy

variables:
  POSTGRES_DB: test_db
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_password
  DATABASE_URL: postgresql://test_user:test_password@postgres:5432/test_db

# Backend Tests
backend-test:
  stage: test
  image: python:3.11
  services:
    - postgres:14-alpine
  before_script:
    - cd backend
    - pip install -r requirements.txt
  script:
    - python manage.py test
  only:
    changes:
      - backend/**/*

# Frontend Tests
frontend-test:
  stage: test
  image: node:18-alpine
  before_script:
    - cd frontend
    - npm install
  script:
    - npm run lint || true
  only:
    changes:
      - frontend/**/*

# Build Backend Docker Image
build-backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - cd backend
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA .
    - docker build -t $CI_REGISTRY_IMAGE/backend:latest .
  only:
    - main
    - develop

# Build Frontend Docker Image
build-frontend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - cd frontend
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA .
    - docker build -t $CI_REGISTRY_IMAGE/frontend:latest .
  only:
    - main
    - develop

# Deploy to Production (example)
deploy-production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
  script:
    - echo "Deploy to production server"
    # Add your deployment commands here
  only:
    - main
  when: manual
